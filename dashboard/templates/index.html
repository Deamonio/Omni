<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KBU SQL Lab Monitor</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        /* 하얀 배경 버그 완전 차단 */
        body { background-color: #0d1117 !important; color: #ffffff !important; font-family: sans-serif; }
        .main-card { background-color: #161b22 !important; border: 1px solid #30363d !important; border-radius: 12px; }
        
        .table { --bs-table-bg: #161b22 !important; color: #ffffff !important; margin-bottom: 0; }
        .table thead th { background-color: #21262d !important; border-bottom: 1px solid #30363d !important; color: #8b949e; }
        .table td { border-bottom: 1px solid #30363d !important; vertical-align: middle; color: #ffffff !important; }
        
        .student-name { color: #58a6ff !important; font-weight: bold; font-size: 1.05rem; }
        .text-dim { color: #8b949e !important; font-size: 0.8rem; }
        .badge-id { background: #21262d; color: #ffffff; padding: 4px 8px; border-radius: 4px; font-family: monospace; }
        
        .status-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 8px; }
        .dot-online { background-color: #3fb950; box-shadow: 0 0 8px #3fb950; animation: pulse 2s infinite; }
        .dot-offline { background-color: #484f58; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>
    <div class="container mt-5">
        <div class="d-flex justify-content-between align-items-end mb-4">
            <div>
                <h2 class="fw-bold text-white">🚀 KBU SQL Lab Monitor</h2>
                <p class="text-secondary mb-0">Managed by Deamon.io</p>
            </div>
            <div class="text-end text-success fw-bold">
                Online: <span id="online-count">0</span> / 29
            </div>
        </div>

        <div class="main-card overflow-hidden">
            <table class="table">
                <thead>
                    <tr>
                        <th>학생 정보</th>
                        <th>학번</th>
                        <th>SSH 포트</th>
                        <th>웹 터미널</th>
                        <th>상태</th>
                    </tr>
                </thead>
                <tbody id="student-list"></tbody>
            </table>
        </div>
    </div>

    <script>
        const socket = io();
        socket.on('update', (data) => {
            let html = '';
            let onlineCount = 0;
            data.students.forEach(s => {
                const isOnline = s.status.includes('실습');
                if(isOnline && s.id !== "0000000") onlineCount++;

                html += `
                    <tr>
                        <td>
                            <div class="student-name">${s.name}</div>
                            <div class="text-dim">0.5 CPU / 512MB</div>
                        </td>
                        <td><span class="badge-id">${s.id}</span></td>
                        <td style="color: #58a6ff; font-weight: bold;">${s.ssh}</td>
                        <td>
                            <a href="/login/${s.id}" target="_blank" class="btn btn-sm btn-success px-3 fw-bold">Launch</a>
                        </td>
                        <td>
                            <span class="${isOnline ? 'text-success' : 'text-secondary'}">
                                <span class="status-dot ${isOnline ? 'dot-online' : 'dot-offline'}"></span>
                                ${s.status}
                            </span>
                        </td>
                    </tr>`;
            });
            document.getElementById('student-list').innerHTML = html;
            document.getElementById('online-count').innerText = onlineCount;
        });
    </script>
</body>
</html>
