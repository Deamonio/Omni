<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Omni Dashboard</title>
    <link rel="icon" type="image/svg+xml" href="/static/omni-logo.svg">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="https://cdn.socket.io/4.0.1/socket.io.min.js"></script>
    <style>
        :root {
            --sidebar-width: 220px;
            --main-bg: #f7f8fa;
            --card-bg: #fff;
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --accent: #22c55e;
            --gray: #64748b;
            --border: #e5e7eb;
        }
        html, body { height: 100%; margin: 0; padding: 0; }
        body {
            min-height: 100vh;
            background: var(--main-bg);
            color: #222;
            font-family: 'Inter', 'Apple SD Gothic Neo', sans-serif;
            display: flex;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: #fff;
            border-right: 1.5px solid var(--border);
            min-height: 100vh;
            display: flex; flex-direction: column; align-items: center;
            padding: 2.5rem 1.2rem 1.2rem 1.2rem;
            box-shadow: 2px 0 12px rgba(0,0,0,0.03);
        }
        .sidebar .logo {
            margin-bottom: 2.5rem;
            display: flex; align-items: center; gap: 0.7em;
        }
        .logo-svg {
            width: 2.1em; height: 2.1em; display: block;
        }
        .logo-text {
            font-size: 1.5rem; font-weight: 800; letter-spacing: -1px; color: var(--primary);
        }
        .sidebar nav {
            width: 100%;
        }
        .sidebar nav a {
            display: block;
            padding: 0.9em 1em;
            color: #222;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            margin-bottom: 0.3em;
            transition: background 0.15s, color 0.15s;
        }
        .sidebar nav a.active, .sidebar nav a:hover {
            background: var(--primary);
            color: #fff;
        }
        .main {
            flex: 1;
            padding: 0 0 0 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .topbar {
            background: #fff;
            padding: 2.2rem 2.5rem 1.2rem 2.5rem;
            border-bottom: 1.5px solid var(--border);
            display: flex; align-items: flex-end; justify-content: space-between;
        }
        .topbar .title {
            font-size: 2.1rem; font-weight: 800; letter-spacing: -1px; display: flex; align-items: center; gap: 0.7em;
        }
        .topbar .desc {
            color: var(--gray); font-size: 1.1rem; margin-top: 0.3em;
        }
        .summary {
            display: flex; gap: 1.5em; margin: 2.5rem 2.5rem 0 2.5rem;
        }
        .summary-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.06);
            padding: 1.3em 2.2em;
            display: flex; flex-direction: column; align-items: flex-start;
            min-width: 160px;
        }
        .summary-card .label {
            color: var(--gray); font-size: 1em; margin-bottom: 0.2em;
        }
        .summary-card .value {
            font-size: 1.7em; font-weight: 800; color: var(--primary);
        }
        .summary-card .accent { color: var(--accent); }
        .student-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 1.5em;
            margin: 2.5rem 2.5rem 2.5rem 2.5rem;
        }
        .alert-panel {
            margin: 1.2rem 2.5rem 0 2.5rem;
            background: #fff8f1;
            border: 1.5px solid #ffd8a8;
            border-radius: 14px;
            padding: 1rem 1.2rem;
        }
        .alert-title {
            font-weight: 800;
            color: #9a3412;
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .alert-count {
            background: #ea580c;
            color: #fff;
            border-radius: 999px;
            padding: 0.1rem 0.55rem;
            font-size: 0.78rem;
            font-weight: 700;
        }
        .alert-list {
            margin: 0;
            padding-left: 1rem;
            color: #7c2d12;
            font-size: 0.93rem;
            line-height: 1.45;
            max-height: 190px;
            overflow: auto;
        }
        .alert-empty {
            color: #6b7280;
            font-size: 0.92rem;
        }
        .student-card {
            background: var(--card-bg);
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0,0,0,0.07);
            padding: 1.5em 1.3em 1.2em 1.3em;
            display: flex; flex-direction: column; gap: 0.7em;
            align-items: flex-start;
            border: 1.5px solid var(--border);
            transition: box-shadow 0.15s, border 0.15s;
        }
        .student-card:hover {
            box-shadow: 0 4px 24px rgba(37,99,235,0.10);
            border: 1.5px solid var(--primary);
        }
        .student-name {
            font-weight: 700; font-size: 1.15em; color: var(--primary);
        }
        .student-id {
            font-family: monospace; background: #f1f5f9; color: #222; border-radius: 6px; padding: 2px 8px; font-size: 1em; margin-left: 0.5em;
        }
        .status-badge {
            display: inline-flex; align-items: center; gap: 0.5em;
            font-size: 0.98em; font-weight: 700;
            border-radius: 999px;
            padding: 0.18em 0.95em 0.18em 0.7em;
            background: #f1f5f9;
            color: #888;
            border: 1.5px solid #e5e7eb;
            box-shadow: 0 1px 4px rgba(0,0,0,0.03);
            transition: background 0.15s, color 0.15s, border 0.15s;
        }
        .status-badge.online {
            background: linear-gradient(90deg, #e0ffe7 0%, #d1fae5 100%);
            color: #1dbf73;
            border: 1.5px solid #b6f2d6;
        }
        .status-badge.offline {
            background: #f8fafc;
            color: #b0b0b0;
            border: 1.5px solid #e5e7eb;
        }
        .status-badge.manage {
            background: linear-gradient(90deg, #e0e7ff 0%, #f1f5ff 100%);
            color: #2563eb;
            border: 1.5px solid #b6c6f2;
        }
        .download-btn {
            background: var(--primary); color: #fff; border-radius: 8px; padding: 0.5em 1.3em; font-weight: 700; border: none; font-size: 1em;
            transition: background 0.15s; margin-top: 0.5em;
            text-decoration: none; display: inline-block;
        }
        .download-btn:hover { background: var(--primary-dark); }
        @media (max-width: 900px) {
            .sidebar { display: none; }
            .main { padding-left: 0; }
            .summary, .student-grid { margin: 1.2rem 0.5rem; }
            .topbar { padding: 1.2rem 0.7rem 0.7rem 0.7rem; }
        }
    </style>
</head>
<body>
    <aside class="sidebar">
        <div class="logo">
            <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                <rect x="3" y="10" width="34" height="20" rx="8" fill="#2563eb"/>
                <rect x="10" y="3" width="20" height="34" rx="8" fill="#1dbf73"/>
                <circle cx="20" cy="20" r="7" fill="#fff"/>
                <circle cx="20" cy="20" r="4" fill="#2563eb"/>
            </svg>
            <span class="logo-text">Omni</span>
        </div>
        <nav>
            <a href="#" class="tab-btn active" data-tab="dashboard">대시보드</a>
            <a href="#" class="tab-btn" data-tab="students">학생 관리</a>
            <a href="#" class="tab-btn" data-tab="settings">설정</a>
        </nav>
    </aside>
    <div class="main">
        <!-- 대시보드 탭 -->
        <section class="tab-section" id="tab-dashboard">
            <div class="topbar">
                <div>
                    <div class="title">
                        <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="10" width="34" height="20" rx="8" fill="#2563eb"/>
                            <rect x="10" y="3" width="20" height="34" rx="8" fill="#1dbf73"/>
                            <circle cx="20" cy="20" r="7" fill="#fff"/>
                            <circle cx="20" cy="20" r="4" fill="#2563eb"/>
                        </svg>
                        Omni Dashboard
                    </div>
                    <div class="desc">실시간 학생 접속 현황 및 관리</div>
                </div>
            </div>
            <div class="summary">
                <div class="summary-card">
                    <div class="label">전체 학생</div>
                    <div class="value" id="total-count">0</div>
                </div>
                <div class="summary-card">
                    <div class="label">온라인</div>
                    <div class="value accent" id="online-count">0</div>
                </div>
            </div>
            <div class="alert-panel">
                <div class="alert-title">
                    앱 중복 실행 자동 차단 로그
                    <span class="alert-count" id="guard-alert-count">0</span>
                </div>
                <div class="alert-empty" id="guard-alert-empty">최근 감지 이벤트가 없습니다.</div>
                <ul class="alert-list" id="guard-alert-list" style="display:none;"></ul>
            </div>
            <div class="student-grid" id="student-grid"></div>
        </section>
        <!-- 학생관리 탭 -->
        <section class="tab-section" id="tab-students" style="display:none;">
            <div class="topbar">
                <div>
                    <div class="title">
                        <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="10" width="34" height="20" rx="8" fill="#2563eb"/>
                            <rect x="10" y="3" width="20" height="34" rx="8" fill="#1dbf73"/>
                            <circle cx="20" cy="20" r="7" fill="#fff"/>
                            <circle cx="20" cy="20" r="4" fill="#2563eb"/>
                        </svg>
                        학생 관리
                    </div>
                    <div class="desc">학생 검색, 상세 정보, 컨테이너 관리</div>
                </div>
            </div>
            <div style="margin:2.5rem 2.5rem 0 2.5rem;display:flex;gap:1.5em;align-items:center;">
                <input id="student-search" type="text" placeholder="이름, 학번 검색" style="flex:1;padding:0.7em 1em;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
                <button id="student-search-btn" style="padding:0.7em 1.5em;border-radius:8px;background:#2563eb;color:#fff;font-weight:700;border:none;">검색</button>
            </div>
            <div class="student-grid" id="student-mgmt-grid" style="margin-top:1.5em;"></div>
        </section>
        <!-- 설정 탭 -->
        <section class="tab-section" id="tab-settings" style="display:none;">
            <div class="topbar">
                <div>
                    <div class="title">
                        <svg class="logo-svg" viewBox="0 0 40 40" fill="none" xmlns="http://www.w3.org/2000/svg">
                            <rect x="3" y="10" width="34" height="20" rx="8" fill="#2563eb"/>
                            <rect x="10" y="3" width="20" height="34" rx="8" fill="#1dbf73"/>
                            <circle cx="20" cy="20" r="7" fill="#fff"/>
                            <circle cx="20" cy="20" r="4" fill="#2563eb"/>
                        </svg>
                        설정
                    </div>
                    <div class="desc">대시보드 테마, 새로고침 주기, 관리자 설정</div>
                </div>
            </div>
            <div style="margin:2.5rem 2.5rem 0 2.5rem;max-width:500px;">
                <div style="margin-bottom:1.5em;">
                    <label style="font-weight:700;">테마</label><br>
                    <select id="theme-select" style="padding:0.6em 1em;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;">
                        <option value="light">라이트</option>
                        <option value="dark">다크</option>
                    </select>
                </div>
                <div style="margin-bottom:1.5em;">
                    <label style="font-weight:700;">실시간 새로고침 주기(초)</label><br>
                    <input id="refresh-interval" type="number" min="1" max="60" value="2" style="padding:0.6em 1em;border-radius:8px;border:1.5px solid #e5e7eb;font-size:1em;width:100px;">
                </div>
                <div style="margin-bottom:1.5em;">
                    <label style="font-weight:700;">공지사항 (SSH 로그인 시 표시)</label><br>
                    <textarea id="notice-editor" style="width:100%;min-height:220px;padding:0.8em 1em;border-radius:8px;border:1.5px solid #e5e7eb;font-size:0.95em;font-family:monospace;line-height:1.4;" placeholder="공지 내용을 입력하세요."></textarea>
                    <div style="margin-top:0.7em;display:flex;gap:0.7em;">
                        <button id="notice-reload-btn" class="download-btn" style="background:#64748b;">불러오기</button>
                        <button id="notice-save-btn" class="download-btn" style="background:#2563eb;">공지 저장</button>
                    </div>
                </div>
            </div>
        </section>
    </div>
    <script>
        let studentMgmtAuthed = false;
        let noticeLoaded = false;

        async function ensureStudentMgmtAuth() {
            if (studentMgmtAuthed) return true;

            const password = window.prompt('학생 관리 탭 비밀번호를 입력하세요.');
            if (password === null) return false;

            try {
                const res = await fetch('/api/student-mgmt/auth', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    alert(data.msg || '비밀번호가 올바르지 않습니다.');
                    return false;
                }
                studentMgmtAuthed = true;
                return true;
            } catch (_err) {
                alert('인증 중 오류가 발생했습니다.');
                return false;
            }
        }

        // 탭 전환 SPA
        document.querySelectorAll('.tab-btn').forEach(btn => {
            btn.addEventListener('click', async function(e) {
                e.preventDefault();

                if (this.dataset.tab === 'students' || this.dataset.tab === 'settings') {
                    const ok = await ensureStudentMgmtAuth();
                    if (!ok) return;
                }

                document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                document.querySelectorAll('.tab-section').forEach(sec => sec.style.display = 'none');
                document.getElementById('tab-' + this.dataset.tab).style.display = '';

                if (this.dataset.tab === 'settings' && !noticeLoaded) {
                    await loadNotice();
                }
            });
        });

        async function loadNotice() {
            try {
                const res = await fetch('/api/notice');
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    alert(data.msg || '공지 불러오기 실패');
                    return;
                }
                document.getElementById('notice-editor').value = data.content || '';
                noticeLoaded = true;
            } catch (_err) {
                alert('공지 불러오기 중 오류가 발생했습니다.');
            }
        }

        async function saveNotice() {
            try {
                const content = document.getElementById('notice-editor').value;
                const res = await fetch('/api/notice', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content })
                });
                const data = await res.json();
                if (!res.ok || !data.ok) {
                    alert(data.msg || '공지 저장 실패');
                    return;
                }
                alert('공지 저장 완료');
            } catch (_err) {
                alert('공지 저장 중 오류가 발생했습니다.');
            }
        }

        // 실시간 학생 데이터 렌더링
        let allStudents = [];
        const socket = io();
        socket.on('update', (data) => {
            allStudents = data.students;
            // 대시보드
            let html = '';
            let onlineCount = 0;
            let totalCount = 0;
            data.students.forEach(s => {
                let badgeClass = '';
                let badgeText = s.status;
                if (s.status === '온라인') {
                    badgeClass = 'status-badge online';
                } else if (s.status === '오프라인') {
                    badgeClass = 'status-badge offline';
                } else {
                    badgeClass = 'status-badge manage';
                }
                if (s.id !== "0000000") totalCount++;
                if (s.status === '온라인' && s.id !== "0000000") onlineCount++;
                html += `
                    <div class="student-card">
                        <div><span class="student-name">${s.name}</span><span class="student-id">${s.id}</span></div>
                        <div><span class="${badgeClass}">${badgeText}</span></div>
                        <a class="download-btn" href="/download/${s.id}">다운로드</a>
                    </div>`;
            });
            document.getElementById('student-grid').innerHTML = html;
            document.getElementById('online-count').innerText = onlineCount;
            document.getElementById('total-count').innerText = totalCount;

            // 학생관리(검색/필터)
            renderStudentMgmt(allStudents);
            renderGuardAlerts(data.app_guard_alerts || []);
        });

        function renderGuardAlerts(alerts) {
            const countEl = document.getElementById('guard-alert-count');
            const emptyEl = document.getElementById('guard-alert-empty');
            const listEl = document.getElementById('guard-alert-list');

            countEl.innerText = alerts.length;
            if (!alerts.length) {
                listEl.style.display = 'none';
                listEl.innerHTML = '';
                emptyEl.style.display = '';
                return;
            }

            emptyEl.style.display = 'none';
            listEl.style.display = '';
            listEl.innerHTML = alerts.map(a =>
                `<li>[${a.timestamp || 'unknown'}] s${a.student_id} - ${a.message}</li>`
            ).join('');
        }

        // 학생관리 검색/필터
        function renderStudentMgmt(students) {
            let html = '';
            students.forEach(s => {
                let badgeClass = '';
                let badgeText = s.status;
                if (s.status === '온라인') {
                    badgeClass = 'status-badge online';
                } else if (s.status === '오프라인') {
                    badgeClass = 'status-badge offline';
                } else {
                    badgeClass = 'status-badge manage';
                }
                html += `
                    <div class="student-card">
                        <div><span class="student-name">${s.name}</span><span class="student-id">${s.id}</span></div>
                        <div><span class="${badgeClass}">${badgeText}</span></div>
                        <div style="margin-top:0.7em;display:flex;gap:0.7em;">
                            <a class="download-btn" href="/download/${s.id}">다운로드</a>
                            <button class="download-btn restart-btn" data-id="${s.id}" style="background:#1dbf73;">재시작</button>
                            <button class="download-btn stop-btn" data-id="${s.id}" style="background:#f59e42;">정지</button>
                        </div>
                    </div>`;
            });
            document.getElementById('student-mgmt-grid').innerHTML = html;
            // 버튼 이벤트 연결
            document.querySelectorAll('.restart-btn').forEach(btn => {
                btn.onclick = function() {
                    const id = this.dataset.id;
                    this.disabled = true;
                    this.innerText = '재시작 중...';
                    fetch(`/api/container/${id}/restart`, {method:'POST'})
                        .then(r=>r.json()).then(res=>{
                            alert(res.ok ? '재시작 완료' : '실패: '+res.msg);
                            this.disabled = false;
                            this.innerText = '재시작';
                        }).catch(()=>{
                            alert('에러');
                            this.disabled = false;
                            this.innerText = '재시작';
                        });
                };
            });
            document.querySelectorAll('.stop-btn').forEach(btn => {
                btn.onclick = function() {
                    const id = this.dataset.id;
                    this.disabled = true;
                    this.innerText = '정지 중...';
                    fetch(`/api/container/${id}/stop`, {method:'POST'})
                        .then(r=>r.json()).then(res=>{
                            alert(res.ok ? '정지 완료' : '실패: '+res.msg);
                            this.disabled = false;
                            this.innerText = '정지';
                        }).catch(()=>{
                            alert('에러');
                            this.disabled = false;
                            this.innerText = '정지';
                        });
                };
            });
        }
        document.getElementById('student-search-btn').onclick = function() {
            const q = document.getElementById('student-search').value.trim();
            if (!q) { renderStudentMgmt(allStudents); return; }
            const filtered = allStudents.filter(s => s.name.includes(q) || s.id.includes(q));
            renderStudentMgmt(filtered);
        };
        document.getElementById('student-search').onkeyup = function(e) {
            if (e.key === 'Enter') document.getElementById('student-search-btn').click();
        };
        document.getElementById('notice-reload-btn').onclick = loadNotice;
        document.getElementById('notice-save-btn').onclick = saveNotice;
        // 설정 탭(테마, 새로고침 주기 등은 실제 기능은 미구현, UI만)
    </script>
</body>
</html>
