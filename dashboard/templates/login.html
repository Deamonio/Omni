<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>KBU SQL Lab - Terminal Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #0d1117 !important; 
            color: #ffffff !important; 
            height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0;
            font-family: sans-serif;
        }

        .login-card { 
            background-color: #161b22; 
            border: 1px solid #30363d; 
            border-radius: 12px; 
            padding: 40px; 
            width: 100%; 
            max-width: 400px; 
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .student-info { color: #58a6ff; font-weight: bold; font-size: 1.2rem; margin-bottom: 20px; }

        /* [핵심 수정] 입력창 배경을 안쪽 그림자로 강제 고정 */
        .form-control { 
            background-color: #0d1117 !important; 
            border: 1px solid #30363d !important; 
            color: #ffffff !important; 
            -webkit-text-fill-color: #ffffff !important; /* 글자색 흰색 강제 */
            margin-bottom: 15px;
            padding: 12px !important;
            font-size: 1.2rem !important;
            
            /* 브라우저가 배경을 흰색으로 덮어쓰는 것을 방지하기 위한 그림자 트릭 */
            box-shadow: inset 0 0 0 1000px #0d1117 !important;
            -webkit-box-shadow: inset 0 0 0 1000px #0d1117 !important;
            transition: background-color 5000s ease-in-out 0s;
        }

        /* 클릭(포커스) 시에도 검은색 유지 및 테두리 효과 */
        .form-control:focus { 
            background-color: #0d1117 !important; 
            color: #ffffff !important;
            -webkit-text-fill-color: #ffffff !important;
            border-color: #58a6ff !important; 
            /* 안쪽 그림자 유지하면서 바깥쪽 광채만 추가 */
            box-shadow: inset 0 0 0 1000px #0d1117, 0 0 0 3px rgba(88, 166, 255, 0.3) !important;
            -webkit-box-shadow: inset 0 0 0 1000px #0d1117, 0 0 0 3px rgba(88, 166, 255, 0.3) !important;
            outline: none !important;
        }

        /* 자동완성 시 발생하는 모든 색상 변화 차단 */
        input:-webkit-autofill,
        input:-webkit-autofill:hover, 
        input:-webkit-autofill:focus,
        input:-internal-autofill-selected {
            -webkit-text-fill-color: #ffffff !important;
            box-shadow: inset 0 0 0 1000px #0d1117 !important;
            -webkit-box-shadow: inset 0 0 0 1000px #0d1117 !important;
        }

        .btn-primary { 
            background-color: #238636; 
            border: none; 
            font-weight: bold; 
            width: 100%; 
            padding: 12px;
            border-radius: 8px;
            transition: 0.2s;
        }
        .btn-primary:hover { background-color: #2ea043; transform: translateY(-1px); }
        .flash-msg { color: #f85149; font-size: 0.9rem; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="login-card shadow-lg">
        <h3 class="mb-2 text-white">🔐 Terminal Access</h3>
        <p class="text-secondary small mb-4">보안 세션을 위해 비밀번호를 입력하세요.</p>
        
        <div class="student-info">{{ student_name }}님</div>
        
        {% with messages = get_flashed_messages() %}
          {% if messages %}<div class="flash-msg">{{ messages[0] }}</div>{% endif %}
        {% endwith %}

        <form method="POST">
            <input type="password" name="password" class="form-control" 
                   placeholder="Password" required autofocus autocomplete="new-password">
            <button type="submit" class="btn btn-primary">터미널 열기</button>
        </form>
        
        <div class="mt-4 small text-secondary">© 2026 Deamon.io</div>
    </div>
</body>
</html>
